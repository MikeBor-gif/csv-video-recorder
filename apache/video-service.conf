# Apache VirtualHost for the video web service (Flask via mod_wsgi).
<VirtualHost *:80>
    ServerName localhost

    # One daemon process with threads; runs as www-data (owner of /app/uploads).
    WSGIDaemonProcess video_service processes=1 threads=8 python-path=/app home=/app user=www-data group=www-data
    WSGIProcessGroup video_service
    WSGIApplicationGroup %{GLOBAL}

    # process-group + application-group => the app is preloaded when the daemon
    # starts, so it connects to PostgreSQL and creates the table before the first request.
    WSGIScriptAlias / /app/web_service.wsgi process-group=video_service application-group=%{GLOBAL}
    WSGIPassAuthorization On

    # Upload size is limited by Flask (MAX_UPLOAD_MB -> JSON 413); Apache's own
    # default (1 GiB since 2.4.54) would answer larger uploads with an HTML page.
    LimitRequestBody 0

    <Directory /app>
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    # Uploaded videos are served by Apache directly (Range requests, no Python).
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options -Indexes
        Require all granted
        # Hide in-progress uploads (.<uuid>.part) and any other dot-files.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Logs go to the container output: docker compose logs web
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    LogLevel warn wsgi:info
</VirtualHost>
