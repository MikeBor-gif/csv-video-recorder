# Video web service: Apache + mod_wsgi (web) and PostgreSQL (db).
# Start: docker compose up --build   ->   http://localhost:8000
# Settings can be overridden in .env (see .env.example); the defaults are for local use only.

services:
  web:
    build: .                       # built from the Dockerfile (Apache + Flask)
    ports:
      - "8000:80"                  # host 8000 -> Apache 80 inside the container
    volumes:
      - uploads:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:-video_pass}   # set a real one in .env (not committed)
      WEB_SERVICE_LOG_LEVEL: ${WEB_SERVICE_LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-videos}
      POSTGRES_USER: ${DB_USER:-video_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-video_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-video_user} -d ${DB_NAME:-videos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
